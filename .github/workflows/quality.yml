name: NewLumino Quality

on:
  push:
    branches:
      - main
      - "audit/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve dependencies and refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: newlumino-lockfile
          path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check
