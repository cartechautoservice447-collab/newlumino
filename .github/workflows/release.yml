name: NewLumino Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "NewLumino release version (for example 1.0.7)"
        required: true
        default: "1.0.7"
        type: string
      capacitor_version:
        description: "Capacitor version for the Android wrapper"
        required: true
        default: "8.5.2"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
      CAPACITOR_VERSION: ${{ inputs.capacitor_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Create temporary Android wrapper
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@$CAPACITOR_VERSION \
            @capacitor/cli@$CAPACITOR_VERSION \
            @capacitor/android@$CAPACITOR_VERSION

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.newlumino.app",
            "appName": "NewLumino",
            "webDir": "dist"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Android release asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "NewLumino-Android-$RELEASE_TAG.apk"

      - name: Package web release asset
        run: |
          cd dist
          zip -r "../NewLumino-Web-$RELEASE_TAG.zip" .
          cd ..

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "NewLumino $RELEASE_TAG" \
            --notes "NewLumino $RELEASE_TAG production web build and Android APK generated by GitHub Actions." \
            "NewLumino-Android-$RELEASE_TAG.apk" \
            "NewLumino-Web-$RELEASE_TAG.zip"
