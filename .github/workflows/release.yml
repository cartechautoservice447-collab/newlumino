name: NewLumino Release

on:
  push:
    branches:
      - main
      - perf/mobile-dashboard-start1-architecture
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v1.0.8
      CAPACITOR_VERSION: 8.5.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Create temporary Android wrapper
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@$CAPACITOR_VERSION \
            @capacitor/cli@$CAPACITOR_VERSION \
            @capacitor/android@$CAPACITOR_VERSION

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.newlumino.app",
            "appName": "NewLumino",
            "webDir": "dist"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Android release asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NewLumino-Android-v1.0.8.apk

      - name: Package web release asset
        run: |
          cd dist
          zip -r ../NewLumino-Web-v1.0.8.zip .
          cd ..

      - name: Create NewLumino v1.0.8 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "NewLumino v1.0.8" \
            --notes "NewLumino v1.0.8 — latest mobile Dashboard rewrite, mobile performance architecture, and runtime stack-overflow fix. Built from the exact current commit on perf/mobile-dashboard-start1-architecture. Production web build and Android APK are generated by GitHub Actions." \
            NewLumino-Android-v1.0.8.apk \
            NewLumino-Web-v1.0.8.zip
