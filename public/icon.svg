<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="lumino-bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="neon-lumino" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glass-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with dark liquid glass depth -->
  <rect width="512" height="512" rx="120" fill="url(#lumino-bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Ambient Aurora Backlight -->
  <circle cx="256" cy="240" r="140" fill="url(#aurora-glow)" filter="url(#glow-blur)" opacity="0.45"/>

  <!-- Glass Hexagon / Diamond Card Motif -->
  <g transform="translate(256, 250)">
    <!-- Liquid Glass Floating Diamond Card -->
    <path d="M 0 -130 L 120 -20 L 0 90 L -120 -20 Z" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3"/>
    
    <!-- Neon Lumino Core Glyph: Active Recall Sparkle & Open Book -->
    <!-- Open Book Pages in Neon Gradient -->
    <path d="M -80 0 C -40 -30 -10 -25 0 0 C 10 -25 40 -30 80 0 L 80 50 C 40 20 10 25 0 50 C -10 25 -40 20 -80 50 Z" 
          fill="url(#neon-lumino)" opacity="0.95"/>
    <path d="M 0 0 L 0 50" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>

    <!-- Central Glowing Lumino Sparkle Star -->
    <path d="M 0 -75 Q 0 -45 25 -45 Q 0 -45 0 -15 Q 0 -45 -25 -45 Q 0 -45 0 -75 Z" 
          fill="#38bdf8" filter="url(#glow-blur)"/>
    <circle cx="0" cy="-45" r="5" fill="#ffffff"/>

    <!-- Mini Floating Sparks -->
    <circle cx="65" cy="-60" r="4" fill="#34d399"/>
    <circle cx="-65" cy="-55" r="3" fill="#a78bfa"/>
    <circle cx="95" cy="15" r="3.5" fill="#38bdf8"/>
    <circle cx="-95" cy="10" r="3" fill="#34d399"/>
  </g>

  <!-- Glass Top Reflection Sheen -->
  <path d="M 40 40 L 472 40 C 472 40 400 190 256 190 C 112 190 40 40 40 40 Z" fill="url(#glass-sheen)" rx="20"/>
</svg>
